<meta name="claude:viewport-fit-sides" content="cover">
<title>Acro Score Builder</title>
<style>
/* Layout: sticky top nav (level/round tabs) over a single scrolling column of cards;
   each card is a self-contained "skill picker" widget reused across Optional/Team. */
:root{
  --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f0ede6; --border:#e2ddd3;
  --fg:#241f1a; --fg-dim:#6b6256; --accent:#8a4a3d; --accent-fg:#ffffff;
  --good:#3f7a52; --warn:#b8862f; --bad:#b1473f;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --surface:#242019; --surface-2:#2c271f; --border:#3a342a;
    --fg:#f3efe8; --fg-dim:#aba195; --accent:#e0a28e; --accent-fg:#241008;
    --good:#7ac491; --warn:#e2b25c; --bad:#e28b82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --surface:#242019; --surface-2:#2c271f; --border:#3a342a;
  --fg:#f3efe8; --fg-dim:#aba195; --accent:#e0a28e; --accent-fg:#241008;
  --good:#7ac491; --warn:#e2b25c; --bad:#e28b82; color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:14px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:14px 10px; margin-inline:-16px; padding-inline:16px;
  border-bottom:1px solid var(--border);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
.brand{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.brand h1{font-size:19px;}
.brand span{color:var(--fg-dim); font-size:12px;}
.tabrow{display:flex; gap:6px; flex-wrap:wrap;}
.tab{
  border:1px solid var(--border); background:var(--surface); color:var(--fg-dim);
  border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600;
}
.tab.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent);}
.subrow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.pill{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600;
}
.pill.active{background:var(--fg); color:var(--bg); border-color:var(--fg);}

main{max-width:760px; margin:0 auto; padding-bottom:60px;}
.sectiontitle{font-size:15px; margin:22px 0 10px; display:flex; align-items:baseline; gap:8px; justify-content:space-between;}
.sectiontitle .req{font-family:var(--font-mono); font-size:12px; color:var(--fg-dim); font-weight:400;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px; margin-bottom:12px;
}
.card h3{font-size:14.5px; margin-bottom:2px;}
.card .meta{color:var(--fg-dim); font-size:12px; margin-bottom:10px;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:8px;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 150px;}
.field label{font-size:11px; color:var(--fg-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
select, input[type=text], input[type=number]{
  background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:7px;
  padding:7px 8px; font-size:13px; font-family:inherit; width:100%;
}
.checkline{display:flex; align-items:center; gap:6px; font-size:13px;}
.checkline input{width:16px;height:16px;}

.athletepicker{position:relative;}
.athletebtn{
  width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border);
  border-radius:7px; padding:7px 8px; font-size:13px; color:var(--fg); min-height:34px;
  display:flex; flex-wrap:wrap; gap:4px; align-items:center;
}
.athletebtn .placeholder{color:var(--fg-dim);}
.chip{background:var(--accent); color:var(--accent-fg); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600;}
.athletepanel{
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px;
  max-height:220px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.athletepanel.open{display:block;}
.athletepanel label{display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:13px; border-radius:6px;}
.athletepanel label:hover{background:var(--surface-2);}
.athletepanel input{width:15px;height:15px;}

.scoreline{
  display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;
  padding-top:10px; border-top:1px dashed var(--border); font-family:var(--font-mono);
}
.scoreline .val{font-size:19px; font-weight:700; color:var(--accent);}
.scoreline .lbl{font-size:12px; color:var(--fg-dim);}
.breakdown{font-size:11.5px; color:var(--fg-dim); font-family:var(--font-mono); margin-top:4px;}

.totalbar{
  display:flex; justify-content:space-between; align-items:center; background:var(--surface-2);
  border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin:14px 0;
}
.totalbar .big{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--accent);}
.totalbar .lbl{font-size:12.5px; color:var(--fg-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}

.ghostbtn{
  background:transparent; border:1px dashed var(--border); color:var(--fg-dim); border-radius:8px;
  padding:9px 12px; font-size:12.5px; font-weight:600; width:100%;
}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent);}
.removebtn{
  background:none; border:none; color:var(--bad); font-size:12px; font-weight:600; padding:4px;
}

.reqgrid{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:14px;}
.reqcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.reqcard .name{font-size:12.5px; font-weight:600;}
.reqcard .status{font-family:var(--font-mono); font-size:12px; font-weight:700;}
.status.met{color:var(--good);} .status.pending{color:var(--warn);}
.dot{width:7px;height:7px;border-radius:50%; display:inline-block; margin-right:5px;}
.dot.met{background:var(--good);} .dot.pending{background:var(--warn);}

textarea.exportbox{
  width:100%; min-height:380px; background:var(--surface-2); color:var(--fg); border:1px solid var(--border);
  border-radius:10px; padding:12px; font-family:var(--font-mono); font-size:12px; line-height:1.6; white-space:pre;
}
.hint{font-size:12px; color:var(--fg-dim); margin:8px 0;}
@media print{
  .topbar,.ghostbtn,.removebtn,select,input,.athletepicker{display:none !important;}
}
</style>

/* ---------------- State ---------------- */
var state = {round:"compulsory", level:3, uid:1, data:{}};
function load(){
  try{
    var raw = localStorage.getItem("acroScoreBuilder_v1");
    if(raw){ var saved = JSON.parse(raw); state.data = saved.data||{}; state.uid = saved.uid||1; }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem("acroScoreBuilder_v1", JSON.stringify({data:state.data, uid:state.uid})); }catch(e){}
}
function nid(){ return "n"+(state.uid++); }
function getBucket(path){
  var o = state.data;
  path.forEach(function(k){ if(!o[k]) o[k]={}; o=o[k]; });
  return o;
}

/* ---------------- Small helpers ---------------- */
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="class") e.className=attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(k){ if(typeof k==="string") e.appendChild(document.createTextNode(k)); else if(k) e.appendChild(k); });
  return e;
}
function diffCategory(pts){
  for(var i=0;i<DIFF_CAT.length;i++){ if(pts>=DIFF_CAT[i][0] && pts<=DIFF_CAT[i][1]) return DIFF_CAT[i]; }
  return [0,0,"—",0];
}
function selectEl(opts, value, onChange, placeholder){
  var s = el("select",{onchange:function(e){ onChange(e.target.value); }});
  if(placeholder) s.appendChild(el("option",{value:""},[placeholder]));
  opts.forEach(function(o){
    var v = Array.isArray(o)?o[0]:o, label = Array.isArray(o)?o[1]:o;
    var op = el("option",{value:v},[label]);
    if(String(value)===String(v)) op.setAttribute("selected","selected");
    s.appendChild(op);
  });
  return s;
}
function field(labelTxt, inputEl){
  return el("div",{class:"field"},[ el("label",{},[labelTxt]), inputEl ]);
}
function athletePicker(selected, onChange){
  var wrap = el("div",{class:"athletepicker"});
  var btn = el("button",{class:"athletebtn", type:"button"});
  var panel = el("div",{class:"athletepanel"});
  function renderBtn(){
    btn.innerHTML = "";
    if(!selected.length) btn.appendChild(el("span",{class:"placeholder"},["Select athlete(s)…"]));
    selected.forEach(function(name){ btn.appendChild(el("span",{class:"chip"},[name])); });
  }
  ATHLETES.forEach(function(name){
    var cb = el("input",{type:"checkbox"});
    cb.checked = selected.indexOf(name)>=0;
    cb.addEventListener("change", function(){
      var i = selected.indexOf(name);
      if(cb.checked && i<0) selected.push(name);
      if(!cb.checked && i>=0) selected.splice(i,1);
      renderBtn(); onChange(selected); save();
    });
    panel.appendChild(el("label",{},[cb, document.createTextNode(name)]));
  });
  btn.addEventListener("click", function(){ panel.classList.toggle("open"); });
  document.addEventListener("click", function(e){ if(!wrap.contains(e.target)) panel.classList.remove("open"); });
  renderBtn();
  wrap.appendChild(btn); wrap.appendChild(panel);
  return wrap;
}

/* ---------------- Acro skill picker (Hand Support / Walk-Pitch-Toss / Punk) ---------------- */
function acroSkillCard(rec, onRemove, title, onUpdate){
  rec.family = rec.family || "wpt";
  rec.group = rec.group || "Group (3+ bases)";
  rec.athletes = rec.athletes || [];
  var card = el("div",{class:"card"});
  var __initial = true;
  function render(){
    card.innerHTML = "";
    card.appendChild(el("h3",{},[title||"Acro Element"]));
    var famSel = selectEl([["hs","Hand Support / Hand-to-Hand"],["wpt","Walk, Pitch & Toss"],["punk","Punk Move"]], rec.family, function(v){ rec.family=v; render(); save(); });
    card.appendChild(el("div",{class:"row"},[ field("Skill family", famSel) ]));

    var entryMap, topMap, dismMap, pts=0, breakdown=[];
    var gp = GROUP_PTS[rec.group];

    if(rec.family==="hs"){ entryMap=HS_ENTRY; topMap=HS_TOP; dismMap=HS_DISMOUNT; }
    else if(rec.family==="wpt"){ entryMap=WPT_ENTRY; topMap=WPT_TOP; dismMap=null; }
    else { entryMap=PUNK_ENTRY; topMap=PUNK_TOP; dismMap=PUNK_DISMOUNT; }

    rec.entry = rec.entry || Object.keys(entryMap)[0];
    rec.top = rec.top || Object.keys(topMap)[0];

    var row1 = el("div",{class:"row"});
    row1.appendChild(field("Entry", selectEl(Object.keys(entryMap), rec.entry, function(v){ rec.entry=v; render(); save(); })));
    row1.appendChild(field("Top skill / hold", selectEl(Object.keys(topMap), rec.top, function(v){ rec.top=v; render(); save(); })));
    card.appendChild(row1);

    if(rec.family==="hs"){

function tumblePassCard(rec, level, onRemove, title, onUpdate){
  rec.mode = rec.mode || "standing";

  var card = el("div",{class:"card"});
  var __initial = true;

    card.innerHTML="";

  render();

/* ---------------- Export ---------------- */
function buildExportText(){
  var lvl = state.level;
  var lines = [];
  lines.push("LEVEL "+lvl+" TEAM — SCORE SUMMARY");
  lines.push("=".repeat(44));
  var c = state.data.compulsory && state.data.compulsory[lvl];
  if(c){
    lines.push("\nCOMPULSORY (SV 10.0 each)");
    Object.keys(COMPULSORY[lvl]).forEach(function(ev){
      lines.push("\n"+ev+":");
      COMPULSORY[lvl][ev].forEach(function(name, idx){
        var rec = c[ev] && c[ev]["s"+idx];
        lines.push("  "+name);
        if(rec) lines.push("    Group 1: "+(rec.g1.join(", ")||"—")+"   Group 2: "+(rec.g2.join(", ")||"—"));
      });
    });
  }
  var o = state.data.optional && state.data.optional[lvl];
  if(o){
    lines.push("\n\nOPTIONAL");
    if(o.acro){
      var at = OPT_BASE[lvl].Acro; o.acro.forEach(function(r){ at += r._value||0; });
      lines.push("\nAcro — base "+OPT_BASE[lvl].Acro.toFixed(1)+" → total "+at.toFixed(2));
      o.acro.forEach(function(r,i){ lines.push("  Element "+(i+1)+": "+(r.family||"")+", entry "+r.entry+" / top "+r.top+(r.dismount?" / dismount "+r.dismount:"")+" → +"+(r._value||0).toFixed(1)+"   ["+ (r.athletes||[]).join(", ") +"]"); });
    }
    if(o.pyramid){
      var pt = OPT_BASE[lvl].Pyramid; o.pyramid.forEach(function(r){ pt += r._value||0; });
      lines.push("\nPyramid — base "+OPT_BASE[lvl].Pyramid.toFixed(1)+" → total "+pt.toFixed(2));
      o.pyramid.forEach(function(r,i){ lines.push("  Pyramid "+(i+1)+": "+r.skill+" (letter "+r.letter+") → +"+(r._value||0).toFixed(1)+"   base:["+(r.base||[]).join(", ")+"] mid:["+(r.mid||[]).join(", ")+"] flyer:["+(r.flyer||[]).join(", ")+"]"); });
    }
    if(o.toss){
      var tt = (o.toss.synced._value||0)+(o.toss.solo._value||0);
      lines.push("\nToss — total "+tt.toFixed(2));
      lines.push("  Synced: "+o.toss.synced.skill+" ("+(o.toss.synced._value||0).toFixed(1)+")   ["+(o.toss.synced.base||[]).concat(o.toss.synced.flyer||[]).join(", ")+"]");
      lines.push("  Solo: "+o.toss.solo.skill+" ("+(o.toss.solo._value||0).toFixed(1)+")   ["+(o.toss.solo.base||[]).concat(o.toss.solo.flyer||[]).join(", ")+"]");
    }
    if(o.tumbling){
      var sum=0; o.tumbling.forEach(function(r){ sum+= r._value||0; });
      var avg = o.tumbling.length? sum/o.tumbling.length:0;
      lines.push("\nTumbling — average of "+o.tumbling.length+" passes = "+avg.toFixed(2));
      o.tumbling.forEach(function(r,i){ lines.push("  Pass "+(i+1)+" ("+r.mode+"): value "+(r._value||0).toFixed(2)+"   ["+(r.athletes||[]).join(", ")+"]"); });
    }
  }
  var t = state.data.team && state.data.team[lvl];
  if(t && t.segments && t.segments.length){
    lines.push("\n\nTEAM ROUTINE SEGMENTS");
    t.segments.forEach(function(seg, i){
      lines.push("\n"+(i+1)+". "+seg.category+(seg.synced?" (synced)":"")+" — "+(seg.skill && (seg.skill.skill || seg.skill.combo || seg.skill.entry) || ""));
    });
  }
  return lines.join("\n");
}

      navigator.clipboard.writeText(box.value).then(function(){ copyBtn.textContent="Copied!"; setTimeout(function(){copyBtn.textContent="Copy summary";},1500); }).catch(function(){});
    }
  }},["Copy summary"]);
  container.appendChild(copyBtn);
}

/* ---------------- Top nav + render ---------------- */
function renderNav(){
  var roundTabs = document.getElementById("roundTabs");
  roundTabs.innerHTML = "";
  [["compulsory","Compulsory"],["optional","Optional"],["team","Team Routine"],["export","Export"]].forEach(function(r){
    var t = el("button",{class:"tab"+(state.round===r[0]?" active":""), type:"button", onclick:function(){ state.round=r[0]; renderAll(); }},[r[1]]);
    roundTabs.appendChild(t);
  });
  var levelPills = document.getElementById("levelPills");
  levelPills.innerHTML = "";
  [3,4].forEach(function(l){
    var p = el("button",{class:"pill"+(state.level===l?" active":""), type:"button", onclick:function(){ state.level=l; renderAll(); }},["Level "+l]);
    levelPills.appendChild(p);
  });
}
function renderTeam(){ var app=document.getElementById("app"); app.innerHTML=""; viewTeam(app); }
function renderAll(){
  renderNav();
  var app = document.getElementById("app");
  app.innerHTML = "";
  if(state.round==="compulsory") viewCompulsory(app);
  else if(state.round==="optional") viewOptional(app);
  else if(state.round==="team") viewTeam(app);
  else viewExport(app);
}

load();
function start(){ renderAll(); }
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
