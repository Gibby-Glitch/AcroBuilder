<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ducks 2026-2027 Season</title>
<style>

/* Layout: sticky top nav (level/round tabs) over a single scrolling column of cards;
   each card is a self-contained "skill picker" widget reused across Optional/Team. */
:root{
  --bg:#f6f8f6; --surface:#ffffff; --surface-2:#eaf0ea; --border:#d2ddd3;
  --fg:#141a16; --fg-dim:#516053; --accent:#1e5631; --accent-fg:#ffffff;
  --good:#2f9e52; --warn:#b8862f; --bad:#b1473f;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#162019; --surface-2:#1c2821; --border:#30402f;
    --fg:#f2f5f0; --fg-dim:#a9b7a9; --accent:#5fcf8b; --accent-fg:#0e1511;
    --good:#7ac491; --warn:#e2b25c; --bad:#e28b82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#162019; --surface-2:#1c2821; --border:#30402f;
  --fg:#f2f5f0; --fg-dim:#a9b7a9; --accent:#5fcf8b; --accent-fg:#0e1511;
  --good:#7ac491; --warn:#e2b25c; --bad:#e28b82; color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:14px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:14px 10px; margin-inline:-16px; padding-inline:16px;
  border-bottom:1px solid var(--border);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
.brand{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.brand h1{font-size:19px;}
.brand span{color:var(--fg-dim); font-size:12px;}
.tabrow{display:flex; gap:6px; flex-wrap:wrap;}
.tab{
  border:1px solid var(--border); background:var(--surface); color:var(--fg-dim);
  border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600;
}
.tab.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent);}
.subrow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.pill{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600;
}
.pill.active{background:var(--fg); color:var(--bg); border-color:var(--fg);}

main{max-width:760px; margin:0 auto; padding-bottom:60px;}
.sectiontitle{font-size:15px; margin:22px 0 10px; display:flex; align-items:baseline; gap:8px; justify-content:space-between;}
.sectiontitle .req{font-family:var(--font-mono); font-size:12px; color:var(--fg-dim); font-weight:400;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px; margin-bottom:12px; position:relative;
}
.card h3{font-size:14.5px; margin-bottom:2px;}
.draghandle{
  display:flex; align-items:center; gap:6px; margin:-4px -4px 8px; padding:6px 8px;
  border-radius:8px; background:var(--surface-2); color:var(--fg-dim); font-size:11.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.04em; cursor:grab; touch-action:none; user-select:none;
}
.draghandle::before{content:"⠿⠿"; font-size:14px; letter-spacing:1px; color:var(--accent);}
.card.dragging{opacity:.5; box-shadow:0 8px 18px rgba(0,0,0,.18); z-index:5;}
.card.dragover{outline:3px solid var(--accent); outline-offset:2px;}
.card .meta{color:var(--fg-dim); font-size:12px; margin-bottom:10px;}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:8px;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0; flex:1 1 150px;}
.field label{font-size:11px; color:var(--fg-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
select, input[type=text], input[type=number]{
  background:var(--surface-2); color:var(--fg); border:1px solid var(--border); border-radius:7px;
  padding:7px 8px; font-size:13px; font-family:inherit; width:100%;
}
.checkline{display:flex; align-items:center; gap:6px; font-size:13px;}
.checkline input{width:16px;height:16px;}

.athletepicker{position:relative;}
.athletebtn{
  width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border);
  border-radius:7px; padding:7px 8px; font-size:13px; color:var(--fg); min-height:34px;
  display:flex; flex-wrap:wrap; gap:4px; align-items:center;
}
.athletebtn .placeholder{color:var(--fg-dim);}
.chip{background:var(--accent); color:var(--accent-fg); border-radius:999px; padding:2px 8px; font-size:12px; font-weight:600;}
.athletepanel{
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px;
  max-height:220px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.athletepanel.open{display:block;}
.athletepanel label{display:flex; align-items:center; gap:8px; padding:5px 4px; font-size:13px; border-radius:6px;}
.athletepanel label:hover{background:var(--surface-2);}
.athletepanel input{width:15px;height:15px;}

.scoreline{
  display:flex; justify-content:space-between; align-items:baseline; margin-top:10px;
  padding-top:10px; border-top:1px dashed var(--border); font-family:var(--font-mono);
}
.scoreline .val{font-size:19px; font-weight:700; color:var(--accent);}
.scoreline .lbl{font-size:12px; color:var(--fg-dim);}
.breakdown{font-size:11.5px; color:var(--fg-dim); font-family:var(--font-mono); margin-top:4px;}

.totalbar{
  display:flex; justify-content:space-between; align-items:center; background:var(--surface-2);
  border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin:14px 0;
}
.totalbar .big{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--accent);}
.totalbar .lbl{font-size:12.5px; color:var(--fg-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}

.ghostbtn{
  background:transparent; border:1px dashed var(--border); color:var(--fg-dim); border-radius:8px;
  padding:9px 12px; font-size:12.5px; font-weight:600; width:100%;
}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent);}
.removebtn{
  background:none; border:none; color:var(--bad); font-size:12px; font-weight:600; padding:4px;
}

.reqgrid{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:14px;}
.reqcard{
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.reqcard .name{font-size:12.5px; font-weight:600;}
.reqcard .status{font-family:var(--font-mono); font-size:12px; font-weight:700;}
.status.met{color:var(--good);} .status.pending{color:var(--warn);}
.dot{width:7px;height:7px;border-radius:50%; display:inline-block; margin-right:5px;}
.dot.met{background:var(--good);} .dot.pending{background:var(--warn);}

textarea.exportbox{
  width:100%; min-height:380px; background:var(--surface-2); color:var(--fg); border:1px solid var(--border);
  border-radius:10px; padding:12px; font-family:var(--font-mono); font-size:12px; line-height:1.6; white-space:pre;
}
.hint{font-size:12px; color:var(--fg-dim); margin:8px 0;}

/* ---------- Judge sheet ---------- */
.judgesheet{ background:#fff; color:#161616; border-radius:12px; padding:16px; border:1px solid var(--border); }
.jsheettitle{
  display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; justify-content:space-between;
  border:3px solid #161616; border-radius:6px; padding:10px 14px; margin:18px 0 10px; font-family:var(--font-display);
}
.jsheettitle span:first-child{ font-size:20px; font-weight:700; }
.jsheettitle span:nth-child(2){ font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.jsheettitle span:last-child{ font-size:13px; color:#444; }
table.judgetable{ width:100%; border-collapse:collapse; margin-bottom:16px; font-size:12.5px; page-break-inside:avoid; }
table.judgetable td{ border:1px solid #333; padding:7px 9px; vertical-align:middle; }
table.judgetable tr.jhead td{ background:#f6cfc8; font-weight:700; text-align:center; color:#161616; }
table.judgetable tr.jhead td.jlabelhead{ text-align:left; }
table.judgetable td.jlabel{ text-align:left; }
table.judgetable td.jscorelabel{ font-weight:700; }
table.judgetable td.jblack{ background:#161616; }
table.judgetable td.jscore{ text-align:center; font-weight:700; }
table.judgetable td.jcol{ width:14%; }
table.judgetable td.jlabelcol{ width:44%; }
@media print{
  .topbar,.ghostbtn,.removebtn,select,input,.athletepicker{display:none !important;}
  body{background:#fff !important;}
  .judgesheet{border:none; padding:0;}
  .judgesheet, .judgesheet *{ color:#161616 !important; }
  table.judgetable tr.jhead td{ background:#f6cfc8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  table.judgetable td.jblack{ background:#161616 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

/* ---------- Practice / Edit mode switch ---------- */
.modeswitch{ display:flex; gap:0; border:2px solid var(--accent); border-radius:999px; overflow:hidden; margin-left:auto; }
.modebtn{
  background:var(--surface); color:var(--accent); border:none; padding:7px 16px; font-size:13px; font-weight:700;
  font-family:var(--font-display); letter-spacing:.02em;
}
.modebtn.active{ background:var(--accent); color:var(--accent-fg); }

/* ---------- Practice view: big, high-contrast, glance-from-across-the-gym ---------- */
.psectitle{
  font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--accent-fg); background:var(--accent); border-radius:10px; padding:10px 16px; margin:18px 0 12px;
}
.psection{
  font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--accent);
  margin:28px 0 10px; padding-bottom:6px; border-bottom:3px solid var(--accent);
}
.psection:first-of-type{ margin-top:4px; }
.pcard{
  background:var(--surface); border:1px solid var(--border); border-left:6px solid var(--accent);
  border-radius:10px; padding:14px 16px; margin-bottom:10px;
}
.ptitle{ font-family:var(--font-display); font-weight:700; font-size:21px; color:var(--fg); text-wrap:balance; }
.psub{ font-size:15px; color:var(--fg-dim); margin-top:3px; }
.prole{ font-size:19px; font-weight:700; color:var(--accent); margin-top:8px; line-height:1.4; }
.prole.empty{ color:var(--fg-dim); font-weight:600; font-style:italic; font-size:15px; }
.pempty{ color:var(--fg-dim); font-size:15px; padding:6px 2px 2px; }

/* Group 1 / Group 2 side-by-side role cards (Compulsory Acro/Toss/Pyramid) */
.pgroupgrid{ display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; }
.pgroup{ flex:1 1 220px; min-width:0; background:var(--surface-2); border-radius:9px; padding:10px 14px 12px; }
.pgrouplabel{
  font-family:var(--font-display); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--accent); margin-bottom:8px; padding-bottom:6px; border-bottom:2px solid var(--accent);
}
.prolerow{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; border-bottom:1px solid var(--border); }
.prolerow:last-child{ border-bottom:none; }
.prolerow .rlabel{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--fg-dim); white-space:nowrap; }
.prolerow .rvalue{ font-size:17px; font-weight:700; color:var(--fg); text-align:right; }
.pgroup.pempty-group{ display:flex; align-items:center; justify-content:center; color:var(--fg-dim); font-size:13px; font-style:italic; }
.proleflat{ margin-top:10px; }

[hidden]{display:none !important;}

.syncbadge{
  margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--fg-dim); border:1px solid var(--border);
}
.syncbadge.live{background:var(--good); color:var(--accent-fg); border-color:var(--good);}
.syncbadge.err{background:var(--bad); color:var(--accent-fg); border-color:var(--bad);}
.brand{position:relative;}

.accessgate{
  position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center;
  padding:16px;
}
.accessbox{
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px 24px; max-width:320px; width:100%;
  text-align:center;
}
.accessbox h2{font-size:18px; margin-bottom:8px;}
.accessbox p{font-size:13px; color:var(--fg-dim); margin-bottom:16px;}
.accessbox input{margin-bottom:10px; text-align:center;}
.accesserror{color:var(--bad); font-size:12.5px; margin-top:10px;}
.printbtn{
  background:var(--accent); color:var(--accent-fg); border:none; border-radius:8px; padding:9px 16px;
  font-size:13px; font-weight:700; margin:6px 0 16px;
}
@media print{ .printbtn{display:none !important;} }

</style>

<!-- Firebase (only used if FIREBASE_CONFIG below is filled in - see README.md) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
"use strict";

/* ================= Live sync (Firebase Firestore) =================
   Fill in FIREBASE_CONFIG below (from your Firebase project settings) to make
   this page sync in real time across every device that opens it - iPad,
   laptop, whatever. Leave it as null and the page works exactly as before:
   each device keeps its own local copy only (localStorage), no sync.
   Setup steps are in README.md. */
var FIREBASE_CONFIG = null;
/* Example:
var FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
*/
var SYNC_DOC_PATH = ["acroScoreBuilder", "sharedTeam"]; // collection, doc id - one shared sheet for this team

var fbDocRef = null, fbReady = false, fbWriteTimer = null, fbLastPushedJSON = null, fbApplyingRemote = false;

function setSyncBadge(mode){
  var b = document.getElementById("syncBadge");
  if(!b) return;
  b.classList.remove("live","err");
  if(mode==="live"){ b.textContent="Synced live"; b.classList.add("live"); }
  else if(mode==="connecting"){ b.textContent="Connecting…"; }
  else if(mode==="err"){ b.textContent="Sync error"; b.classList.add("err"); }
  else { b.textContent="Local only"; }
}

function fbInit(){
  if(!FIREBASE_CONFIG){ setSyncBadge("local"); return; }
  if(typeof firebase === "undefined"){ setSyncBadge("err"); return; }
  try{
    setSyncBadge("connecting");
    firebase.initializeApp(FIREBASE_CONFIG);
    var db = firebase.firestore();
    fbDocRef = db.collection(SYNC_DOC_PATH[0]).doc(SYNC_DOC_PATH[1]);
    fbDocRef.onSnapshot(function(snap){
      fbReady = true;
      setSyncBadge("live");
      if(!snap.exists) return;
      var remote = snap.data();
      if(!remote) return;
      var remoteJSON = JSON.stringify(remote.data||{});
      if(remoteJSON === fbLastPushedJSON) return; // our own write echoing back - ignore
      fbApplyingRemote = true;
      state.data = remote.data || {};
      state.uid = remote.uid || state.uid;
      state.teamName = remote.teamName || state.teamName;
      try{ renderAll(); }catch(e){}
      fbApplyingRemote = false;
    }, function(err){
      console.warn("Sync listen failed:", err);
      setSyncBadge("err");
    });
  }catch(e){
    console.warn("Firebase init failed:", e);
    setSyncBadge("err");
  }
}

function fbPush(){
  if(!fbDocRef || fbApplyingRemote) return;
  clearTimeout(fbWriteTimer);
  fbWriteTimer = setTimeout(function(){
    var payload = { data: state.data, uid: state.uid, teamName: state.teamName, _updatedAt: Date.now() };
    fbLastPushedJSON = JSON.stringify(payload.data);
    fbDocRef.set(payload).catch(function(e){ console.warn("Sync push failed:", e); setSyncBadge("err"); });
  }, 500);
}

/* ================= Simple team access code =================
   Not real security (the code lives in this file's source), but keeps the
   page from being casually opened or edited by someone who doesn't have the
   code. Set to "" (empty string) to turn the gate off entirely. */
var ACCESS_CODE = "DUCKS2027"; // change this to whatever code you want your team to use
var ACCESS_STORAGE_KEY = "acroAccessUnlocked_v1";

function checkAccess(){
  var gate = document.getElementById("accessGate");
  if(!gate) return;
  var unlocked = false;
  try{ unlocked = localStorage.getItem(ACCESS_STORAGE_KEY) === "1"; }catch(e){}
  if(!ACCESS_CODE || unlocked){ gate.hidden = true; return; }
  gate.hidden = false;
  var input = document.getElementById("accessInput");
  var btn = document.getElementById("accessBtn");
  var errBox = document.getElementById("accessError");
  function tryUnlock(){
    if(input.value === ACCESS_CODE){
      try{ localStorage.setItem(ACCESS_STORAGE_KEY, "1"); }catch(e){}
      gate.hidden = true;
    } else {
      errBox.hidden = false;
      input.value = "";
      input.focus();
    }
  }
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") tryUnlock(); });
  input.focus();
}

var HS_ENTRY = {"Elevator In":1,"Walk Up from Behind":2,"Hip Pop from Behind":3,"Calf Pop from Behind":4,

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="class") e.className=attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(k){ if(typeof k==="string") e.appendChild(document.createTextNode(k)); else if(k) e.appendChild(k); });
  return e;
}

/* Small "⠿⠿ drag to reorder" grip, prepended to a card. Dragging only arms
   while the pointer is down on the grip itself, so selects/inputs/buttons
   elsewhere on the card keep working normally. */
function addDragHandle(card){
  var handle = el("div",{class:"draghandle"},["Drag to reorder"]);
  card.insertBefore(handle, card.firstChild);
  return handle;
}

/* Pointer-based drag reorder (works with mouse, touch and pen — unlike the
   native HTML5 Drag and Drop API, which iPad Safari doesn't support).
   wrap: the element directly containing the draggable cards.
   selector: class selector for the cards (must include addDragHandle()'s card).
   onReorder(fromIndex, toIndex): called once when a drag ends somewhere new;
   caller is responsible for reordering its own data array and saving/redrawing. */
function enableDragReorder(wrap, selector, onReorder){
  var dragEl = null, items = [];
  function clearHighlights(){ items.forEach(function(it){ it.classList.remove("dragover"); }); }
  function onMove(e){
    if(!dragEl) return;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    dragEl.style.transform = "translateY("+(y - dragEl._startY)+"px)";
    clearHighlights();
    items.forEach(function(it){
      if(it===dragEl) return;
      var r = it.getBoundingClientRect();
      if(y > r.top && y < r.bottom) it.classList.add("dragover");
    });
  }
  function onUp(){
    if(!dragEl) return;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    var overEl = wrap.querySelector(selector+".dragover");
    dragEl.style.transform = ""; dragEl.classList.remove("dragging");
    clearHighlights();
    var from = items.indexOf(dragEl), to = overEl ? items.indexOf(overEl) : -1;
    dragEl = null;
    if(to>=0 && to!==from) onReorder(from, to);
  }
  wrap.querySelectorAll(selector).forEach(function(card){
    var handle = card.querySelector(".draghandle");
    if(!handle) return;
    handle.addEventListener("pointerdown", function(e){
      items = Array.prototype.slice.call(wrap.querySelectorAll(selector));
      dragEl = card;
      card._startY = e.clientY;
      card.classList.add("dragging");
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  });
}
function diffCategory(pts){
  for(var i=0;i<DIFF_CAT.length;i++){ if(pts>=DIFF_CAT[i][0] && pts<=DIFF_CAT[i][1]) return DIFF_CAT[i]; }
  return [0,0,"—",0];
}
function selectEl(opts, value, onChange, placeholder){
  var s = el("select",{onchange:function(e){ onChange(e.target.value); }});
  if(placeholder) s.appendChild(el("option",{value:""},[placeholder]));
  opts.forEach(function(o){
    var v = Array.isArray(o)?o[0]:o, label = Array.isArray(o)?o[1]:o;
    var op = el("option",{value:v},[label]);
    if(String(value)===String(v)) op.setAttribute("selected","selected");
    s.appendChild(op);
  });
  return s;
}

function athletePicker(selected, onChange){
  var wrap = el("div",{class:"athletepicker"});
  var btn = el("button",{class:"athletebtn", type:"button"});
  var panel = el("div",{class:"athletepanel"});
  function renderBtn(){
    btn.innerHTML = "";
    if(!selected.length) btn.appendChild(el("span",{class:"placeholder"},["Select athlete(s)…"]));
    selected.forEach(function(name){ btn.appendChild(el("span",{class:"chip"},[name])); });
  }
  ATHLETES.forEach(function(name){
    var cb = el("input",{type:"checkbox"});
    cb.checked = selected.indexOf(name)>=0;
    cb.addEventListener("change", function(){
      var i = selected.indexOf(name);
      if(cb.checked && i<0) selected.push(name);
      if(!cb.checked && i>=0) selected.splice(i,1);
      renderBtn(); onChange(selected); save();
    });
    panel.appendChild(el("label",{},[cb, document.createTextNode(name)]));
  });
  btn.addEventListener("click", function(){ panel.classList.toggle("open"); });
  document.addEventListener("click", function(e){ if(!wrap.contains(e.target)) panel.classList.remove("open"); });
  renderBtn();
  wrap.appendChild(btn); wrap.appendChild(panel);
  return wrap;
}

/* A labeled athlete picker for one physical role (side base, flyer, mid, etc.)
   with an explicit "N/A" toggle for roles that don't apply to a given skill/group. */
function rolePicker(rec, key, label){
  rec[key] = rec[key] || [];
  rec[key+"_na"] = !!rec[key+"_na"];
  var wrap = el("div",{class:"field"});
  wrap.appendChild(el("label",{},[label]));
  var slot = el("div");
  function paint(){
    slot.innerHTML = "";
    if(rec[key+"_na"]){
      slot.appendChild(el("div",{class:"athletebtn"},[ el("span",{class:"placeholder"},["N/A"]) ]));
    } else {
      slot.appendChild(athletePicker(rec[key], function(a){ rec[key]=a; save(); }));
    }
  }
  paint();
  var naLabel = el("label",{class:"checkline"});
  var naCb = el("input",{type:"checkbox"}); naCb.checked = rec[key+"_na"];
  naCb.addEventListener("change", function(){
    rec[key+"_na"] = naCb.checked;
    if(naCb.checked) rec[key] = [];
    paint(); save();
  });
  naLabel.appendChild(naCb); naLabel.appendChild(document.createTextNode(" N/A"));
  wrap.appendChild(slot);
  wrap.appendChild(naLabel);
  return wrap;
}
function roleExport(rec, key, label){
  return label+":"+(rec[key+"_na"] ? "N/A" : "["+(rec[key]||[]).join(", ")+"]");
}
/* Same as roleExport, but returns null for a role nobody touched (no names,
   no explicit N/A) so export text doesn't pad every pyramid with unused
   "Front Base:[]" / "Catcher:[]" clutter for the roles it doesn't use. */
function roleExportIfUsed(rec, key, label){
  var used = (rec[key] && rec[key].length) || rec[key+"_na"];
  return used ? roleExport(rec, key, label) : null;
}
/* Full pyramid role line for export text: the three core roles always show,
   the four "loaded in from outside the stack" roles only show if someone
   actually assigned (or explicitly N/A'd) them. */
function pyramidRoleExportLine(rec, prefix){
  prefix = prefix || "";
  function k(suffix){ return prefix ? (prefix+suffix) : (suffix.charAt(0).toLowerCase()+suffix.slice(1)); }
  var parts = [roleExport(rec,k("BottomBase"),"Bottom Base"), roleExport(rec,k("Mid"),"Mid"), roleExport(rec,k("Flyer"),"Flyer")];
  [["FrontBase","Front Base"],["BackBase","Back Base"],["SideBase","Side Base"],["Catcher","Catcher"]].forEach(function(p){
    var v = roleExportIfUsed(rec, k(p[0]), p[1]);
    if(v) parts.push(v);
  });
  return parts.join(" ");
}

/* Lets a coach enter a skill/value that isn't in the chart yet, bypassing the

   (passed as renderFn) whenever the checkbox or value changes so the scoreline updates. */
function customOverrideField(rec, renderFn){
  rec.custom = !!rec.custom;
  rec.customName = rec.customName || "";
  rec.customValue = (rec.customValue===undefined || rec.customValue===null) ? "" : rec.customValue;
  var wrap = el("div",{});

  cb.addEventListener("change", function(){ rec.custom = cb.checked; save(); renderFn(); });
  cbLine.appendChild(cb); cbLine.appendChild(document.createTextNode(" Skill/score not listed — enter manually"));
  wrap.appendChild(cbLine);
  if(rec.custom){
    var row = el("div",{class:"row"});
    var nameInput = el("input",{type:"text", placeholder:"e.g. Full-Twisting Layout"}); nameInput.value = rec.customName;
    nameInput.addEventListener("input", function(){ rec.customName = nameInput.value; save(); });

    valInput.addEventListener("input", function(){ rec.customValue = valInput.value; save(); renderFn(); });
    row.appendChild(field("Custom skill name", nameInput));
    row.appendChild(field("Score / bonus value", valInput));
    wrap.appendChild(row);
  }
  return wrap;
}

/* Pyramid roles: Bottom Base(s)/Mid(s)/Flyer(s) always apply. Some pyramids
   also have bases load the flyer in from outside the stack — Front Base,
   Back Base, Side Base(s), and Catcher(s) cover that, each N/A-able via
   rolePicker when a given pyramid doesn't use them. There's no sync/
   group-type concept for pyramids in Compulsory or Optional (that only
   exists if a team chooses a synced pyramid moment in Team Routine, via
   that tab's own Synchronized checkbox).
   prefix "" matches the no-prefix key convention used by pyramidSkillCard
   and instanceRoleFields (e.g. "bottomBase"); a prefix like "g1" matches
   the Compulsory group convention (e.g. "g1BottomBase"). */
function pyramidRoleFields(rec, prefix){
  prefix = prefix || "";
  function k(suffix){ return prefix ? (prefix+suffix) : (suffix.charAt(0).toLowerCase()+suffix.slice(1)); }
  return [
    rolePicker(rec, k("BottomBase"), "Bottom Base(s)"),
    rolePicker(rec, k("Mid"), "Mid(s)"),
    rolePicker(rec, k("Flyer"), "Flyer(s)"),
    rolePicker(rec, k("FrontBase"), "Front Base"),
    rolePicker(rec, k("BackBase"), "Back Base(s)"),
    rolePicker(rec, k("SideBase"), "Side Base(s)"),
    rolePicker(rec, k("Catcher"), "Catcher(s)")
  ];
}
function pyramidGroupRoleBlock(rec, prefix, label){

/* Compulsory tumbling has no bases/mids/flyers at all — just a required
   number of tumblers performing the pass, where the required count is the
   team's roster size for this level, divided by 2 and rounded down
   (e.g. 11 athletes → 5 tumblers), capped at a max of 6 (12+ athletes → 6). */
function requiredTumblers(lvl){
  var size = (state.teamSize && state.teamSize[lvl]) || ATHLETES.length;
  return Math.min(6, Math.floor(size/2));

function skillLabelFor(category, r){
  r = r || {};
  if(skillDesc(r)) return skillDesc(r);
  if(category==="Pyramid") return r.skill || ("Letter "+(r.letter||""));
  if(category==="Toss") return r.skill || "";
  if(category==="Standing Tumbling" || category==="Running Tumbling" || category==="Tumbling"){
    if(r.mode==="standing") return r.combo || "";
    var parts=[r.entry];
    if(r.t1 && r.t1!=="(none)") parts.push(r.t1);
    if(r.t2 && r.t2!=="(none)") parts.push(r.t2);
    if(r.dismount) parts.push(r.dismount);
    return parts.filter(Boolean).join(" → ");
  }
  var parts=[r.entry, r.top];
  if(r.dismount) parts.push(r.dismount);
  return parts.filter(Boolean).join(" → ");
}

/* ---------------- Export ---------------- */
function skillDesc(r){
  if(r.custom) return "CUSTOM: "+(r.customName||"(unnamed)");
  return null;
}
function buildExportText(){
  var lvl = state.level;
  var lines = [];
  lines.push("LEVEL "+lvl+" TEAM — SCORE SUMMARY");
  lines.push("=".repeat(44));
  var c = state.data.compulsory && state.data.compulsory[lvl];
  if(c){
    lines.push("\nCOMPULSORY (SV 10.0 each)");
    Object.keys(COMPULSORY[lvl]).forEach(function(ev){
      lines.push("\n"+ev+":");
      var skillNames = COMPULSORY[lvl][ev];
      var evBucket = c[ev] || {};
      var order = (Array.isArray(evBucket.order) && evBucket.order.length===skillNames.length)
        ? evBucket.order : skillNames.map(function(_,i){ return i; });
      order.forEach(function(idx){
        var name = skillNames[idx];
        var rec = evBucket["s"+idx];
        lines.push("  "+name);
        if(rec){
          if(ev==="Pyramid"){
            lines.push("    Pyramid 1 — "+pyramidRoleExportLine(rec,"g1"));
            lines.push("    Pyramid 2 — "+pyramidRoleExportLine(rec,"g2"));
          } else if(ev==="Tumbling"){
            var req = requiredTumblers(lvl);
            lines.push("    Tumblers — ["+(rec.tumblers||[]).join(", ")+"] ("+(rec.tumblers||[]).length+"/"+req+")");
          } else {
            lines.push("    Group 1 — "+roleExport(rec,"g1SideBase","Side Base")+" "+roleExport(rec,"g1FrontBase","Front Base")+" "+roleExport(rec,"g1BackBase","Back Base(s)")+" "+roleExport(rec,"g1Flyer","Flyer"));
            lines.push("    Group 2 — "+roleExport(rec,"g2SideBase","Side Base")+" "+roleExport(rec,"g2FrontBase","Front Base")+" "+roleExport(rec,"g2BackBase","Back Base(s)")+" "+roleExport(rec,"g2Flyer","Flyer"));
          }
        }
      });
    });
  }
  var o = state.data.optional && state.data.optional[lvl];
  if(o){
    lines.push("\n\nOPTIONAL");
    if(o.acro){
      var at = OPT_BASE[lvl].Acro; o.acro.forEach(function(r){ at += r._value||0; });
      lines.push("\nAcro — base "+OPT_BASE[lvl].Acro.toFixed(1)+" → total "+at.toFixed(2));
      o.acro.forEach(function(r,i){ lines.push("  Element "+(i+1)+": "+(skillDesc(r) || (r.family||"")+", entry "+r.entry+" / top "+r.top+(r.dismount?" / dismount "+r.dismount:""))+" → +"+(r._value||0).toFixed(1)+"   "+roleExport(r,"sideBase","Side Base")+" "+roleExport(r,"frontBase","Front Base")+" "+roleExport(r,"backBase","Back Base(s)")+" "+roleExport(r,"flyer","Flyer")); });
    }
    if(o.pyramid){
      var pt = OPT_BASE[lvl].Pyramid; o.pyramid.forEach(function(r){ pt += r._value||0; });
      lines.push("\nPyramid — base "+OPT_BASE[lvl].Pyramid.toFixed(1)+" → total "+pt.toFixed(2));
      o.pyramid.forEach(function(r,i){ lines.push("  Pyramid "+(i+1)+": "+(skillDesc(r) || r.skill+" (letter "+r.letter+")")+" → +"+(r._value||0).toFixed(1)+"   "+pyramidRoleExportLine(r)); });
    }
    if(o.toss){
      var tt = (o.toss.synced._value||0)+(o.toss.solo._value||0);
      lines.push("\nToss — total "+tt.toFixed(2));
      lines.push("  Synced: "+(skillDesc(o.toss.synced) || o.toss.synced.skill)+" ("+(o.toss.synced._value||0).toFixed(1)+")   "+roleExport(o.toss.synced,"sideBase","Side Base")+" "+roleExport(o.toss.synced,"frontBase","Front Base")+" "+roleExport(o.toss.synced,"backBase","Back Base(s)")+" "+roleExport(o.toss.synced,"flyer","Flyer"));
      lines.push("  Solo: "+(skillDesc(o.toss.solo) || o.toss.solo.skill)+" ("+(o.toss.solo._value||0).toFixed(1)+")   "+roleExport(o.toss.solo,"sideBase","Side Base")+" "+roleExport(o.toss.solo,"frontBase","Front Base")+" "+roleExport(o.toss.solo,"backBase","Back Base(s)")+" "+roleExport(o.toss.solo,"flyer","Flyer"));
    }
    if(o.tumbling){
      var sum=0; o.tumbling.forEach(function(r){ sum+= r._value||0; });
      var avg = o.tumbling.length? sum/o.tumbling.length:0;
      lines.push("\nTumbling — average of "+o.tumbling.length+" passes = "+avg.toFixed(2));
      o.tumbling.forEach(function(r,i){ lines.push("  Pass "+(i+1)+" ("+(skillDesc(r) || r.mode)+"): value "+(r._value||0).toFixed(2)+"   ["+(r.athletes||[]).join(", ")+"]"); });
    }
  }
  var t = state.data.team && state.data.team[lvl];
  if(t && t.segments && t.segments.length){
    lines.push("\n\nTEAM ROUTINE SEGMENTS (in order)");
    t.segments.forEach(function(seg, i){
      var names = segmentPerformerGroupsText(seg);
      var groupCount = (seg.instances && seg.instances.length) || 1;
      lines.push("\n"+(i+1)+". "+seg.category+(seg.synced?" (synced × "+groupCount+")":"")+(seg.filler?" [FILLER — not judged, not counted]":"")+" — "+teamSkillLabel(seg)+" → +"+((seg.skill && seg.skill._value)||0).toFixed(2));
      lines.push("    "+(names || "(no athletes assigned yet)"));
    });
  }
  return lines.join("\n");
}
function viewExport(container){
  container.appendChild(el("div",{class:"sectiontitle"},[ el("span",{},["My Export (athletes & positions)"]) ]));
  container.appendChild(el("div",{class:"hint"},["This is your own copy — every skill with the athletes and roles you assigned, so you know who's in what position. For a blank scoring sheet to hand judges, use the Judges tab instead."]));

  container.appendChild(copyBtn);
}

      var names = instanceNames(r).join(", ");
      return {text: skillLabelFor("Acro", r) + (names?" ("+names+")":"") + "  "+(r._value||0).toFixed(2)};
    });
    var acroTotal = OPT_BASE[lvl].Acro; o.acro.forEach(function(r){ acroTotal += r._value||0; });
    acroRows.push({text:"START VALUE "+acroTotal.toFixed(2), score:true});
    wrap.appendChild(judgeBlock("ACRO SKILLS ("+o.acro.length+")", acroRows));
  }
  if(o.pyramid && o.pyramid.length){
    var pyrRows = o.pyramid.map(function(r){
      var names = instanceNames(r).join(", ");
      return {text: skillLabelFor("Pyramid", r) + (names?" ("+names+")":"") + "  "+(r._value||0).toFixed(2)};
    });
    var pyrTotal = OPT_BASE[lvl].Pyramid; o.pyramid.forEach(function(r){ pyrTotal += r._value||0; });
    pyrRows.push({text:"START VALUE "+pyrTotal.toFixed(2), score:true});
    wrap.appendChild(judgeBlock("PYRAMID ("+o.pyramid.length+")", pyrRows));
  }
  if(o.toss && o.toss.synced){
    var sNames = instanceNames(o.toss.synced).join(", "), oNames = instanceNames(o.toss.solo).join(", ");
    var tossRows = [
      {text: skillLabelFor("Toss", o.toss.synced)+" (sync)"+(sNames?" ("+sNames+")":"")+"  "+(o.toss.synced._value||0).toFixed(2)},
      {text: skillLabelFor("Toss", o.toss.solo)+" (solo)"+(oNames?" ("+oNames+")":"")+"  "+(o.toss.solo._value||0).toFixed(2)}
    ];
    var tossTotal = (o.toss.synced._value||0)+(o.toss.solo._value||0);
    tossRows.push({text:"START VALUE "+tossTotal.toFixed(2), score:true});

  }
  if(o.tumbling && o.tumbling.length){
    var tLabels = []; var req = TUMBLE_OPT[lvl];
    for(var s=1;s<=req.solo;s++) tLabels.push("SOLO TUMBLING PASS");
    tLabels.push("DUO PASS","TRIO PASS","QUAD PASS");
    o.tumbling.forEach(function(r,i){
      var names = instanceNames(r).join(", ");
      var rows = [
        {text: skillLabelFor("Tumbling", r) + (names?" ("+names+")":"")},
        {text:"START VALUE "+(r._value||0).toFixed(2), score:true}
      ];
      wrap.appendChild(judgeBlock(tLabels[i]||"PASS", rows));
    });
  }

  // ---- Team Routine ----
  var t = getBucket(["team", lvl]);
  if(t.segments && t.segments.length){
    wrap.appendChild(sheetTitle(lvl, "TEAM ROUTINE"));
    var rows = t.segments.map(function(seg){
      var names = segmentPerformerGroupsText(seg);
      var val = (seg.skill && seg.skill._value) || 0;
      return {text: teamSkillLabel(seg) + (names?" ("+names+")":"") + (seg.filler?"  [FILLER — DO NOT JUDGE]":"  "+val.toFixed(2))};
    });
    var catValues = {}; Object.keys(TEAM_REQ[lvl]).forEach(function(k){ catValues[k]=[]; });
    t.segments.forEach(function(seg){ if(!seg.filler && catValues[seg.category]) catValues[seg.category].push((seg.skill&&seg.skill._value)||0); });
    var avgParts = [], totalSV = 0;
    Object.keys(catValues).forEach(function(k){
      var arr = catValues[k];
      if(arr.length){
        var avg = arr.reduce(function(a,b){return a+b;},0)/arr.length;
        avgParts.push("avg "+k.toLowerCase()+" "+avg.toFixed(2));
        totalSV += avg;
      }
    });
    rows.push({text: (avgParts.join(", ")||"(no segments scored yet)") });
    rows.push({text:"SV: "+totalSV.toFixed(2), score:true});
    wrap.appendChild(judgeBlock("SKILLS — IN ORDER", rows));
  }

  container.appendChild(wrap);
}

/* ---------------- Practice view: big-font, glance-and-go reference ---------------- */
function practiceRoleLine(rec, pairs){
  rec = rec || {};
  var parts = pairs.map(function(p){
    var key = p[0], label = p[1];
    if(rec[key+"_na"]) return null;
    var names = rec[key]||[];
    if(!names.length) return null;
    return label+": "+names.join(", ");
  }).filter(Boolean);
  return parts.join("   •   ");
}
/* Returns [{label, value}] for only the roles that actually have names set
   (skips N/A'd and untouched roles) — feeds the card-style role list below. */
function practiceRoleRows(rec, pairs){
  rec = rec || {};
  return pairs.map(function(p){
    var key = p[0], label = p[1];
    if(rec[key+"_na"]) return null;
    var names = rec[key]||[];
    if(!names.length) return null;
    return {label:label, value:names.join(", ")};
  }).filter(Boolean);
}
function practiceCard(title, sub, roleLine){
  var card = el("div",{class:"pcard"});
  card.appendChild(el("div",{class:"ptitle"},[title]));
  if(sub) card.appendChild(el("div",{class:"psub"},[sub]));
  if(roleLine) card.appendChild(el("div",{class:"prole"},[roleLine]));
  else card.appendChild(el("div",{class:"prole empty"},["No athletes assigned yet — set this in Edit mode"]));
  return card;
}
/* Skill name at the top, then one or two role columns (Group 1 / Group 2
   side by side) each listing ROLE: NAME rows — used wherever Compulsory
   has two simultaneous groups performing the same skill. */
function practiceGroupCard(title, sub, groups){
  var card = el("div",{class:"pcard"});
  card.appendChild(el("div",{class:"ptitle"},[title]));
  if(sub) card.appendChild(el("div",{class:"psub"},[sub]));
  var anyRows = groups.some(function(g){ return g.rows && g.rows.length; });
  if(!anyRows){
    card.appendChild(el("div",{class:"prole empty"},["No athletes assigned yet — set this in Edit mode"]));
    return card;
  }
  var grid = el("div",{class:"pgroupgrid"});
  groups.forEach(function(g){
    var col = el("div",{class: g.rows.length ? "pgroup" : "pgroup pempty-group"});
    if(g.rows.length){
      col.appendChild(el("div",{class:"pgrouplabel"},[g.label]));
      g.rows.forEach(function(r){
        col.appendChild(el("div",{class:"prolerow"},[
          el("span",{class:"rlabel"},[r.label]), el("span",{class:"rvalue"},[r.value])
        ]));
      });
    } else {
      col.appendChild(el("span",{},[g.label+" — not assigned"]));
    }
    grid.appendChild(col);
  });
  card.appendChild(grid);
  return card;
}
/* Same role-row list as practiceGroupCard, but for the single-group cases
   (one Optional element, not two Compulsory groups) — no "Group 1" box. */

    return;
  }
  // Follow the same drag-set performance order used in Edit mode, not the
  // fixed rulebook order — that's the whole point of a practice reference.
  if(!Array.isArray(evBucket.order) || evBucket.order.length !== skillNames.length){
    evBucket.order = skillNames.map(function(_,i){ return i; });
  }

    } else {
      container.appendChild(practiceGroupCard(skillName, eventName+" compulsory", [
        {label:"GROUP 1", rows: practiceRoleRows(rec, [["g1SideBase","Side"],["g1FrontBase","Front"],["g1BackBase","Back"],["g1Flyer","Flyer"]])},

      ]));

function viewPracticeOptionalSub(container, cat){
  var lvl = state.level;
  var obucket = getBucket(["optional", lvl]);
  if(cat==="Acro"){
    var acro = obucket.acro||[];
    if(!acro.length) container.appendChild(el("div",{class:"pempty"},["No acro optional elements set yet."]));
    acro.forEach(function(rec,i){
      var rows = practiceRoleRows(rec, [["sideBase","Side"],["frontBase","Front"],["backBase","Back"],["flyer","Flyer"]]);
      var sub = skillDesc(rec) || [rec.entry,rec.top,rec.dismount].filter(Boolean).join(" → ") || "(not set yet)";
      container.appendChild(practiceFlatRoleCard("Element "+(i+1), sub, rows));
    });
  } else if(cat==="Pyramid"){
    var pyr = obucket.pyramid||[];
    if(!pyr.length) container.appendChild(el("div",{class:"pempty"},["No pyramid optional elements set yet."]));
    pyr.forEach(function(rec,i){
      var rows = practiceRoleRows(rec, [["bottomBase","Bottom"],["mid","Mid"],["flyer","Flyer"],["frontBase","Front"],["backBase","Back"],["sideBase","Side"],["catcher","Catcher"]]);
      container.appendChild(practiceFlatRoleCard("Pyramid "+(i+1), skillDesc(rec) || rec.skill || "(not set yet)", rows));
    });
  } else if(cat==="Toss"){
    if(!obucket.toss){ container.appendChild(el("div",{class:"pempty"},["No toss optional set yet."])); return; }
    [["synced","Synced Toss"],["solo","Solo Toss"]].forEach(function(p){
      var rec = obucket.toss[p[0]];
      if(rec){
        var rows = practiceRoleRows(rec, [["sideBase","Side"],["frontBase","Front"],["backBase","Back"],["flyer","Flyer"]]);
        container.appendChild(practiceFlatRoleCard(p[1], skillDesc(rec) || rec.skill || "(not set yet)", rows));
      }
    });
  } else {
    var tum = obucket.tumbling||[];
    if(!tum.length) container.appendChild(el("div",{class:"pempty"},["No tumbling optional passes set yet."]));
    tum.forEach(function(rec,i){
      var names = (rec.athletes||[]).join(", ");
      container.appendChild(practiceCard("Pass "+(i+1), skillDesc(rec) || skillLabelFor("Tumbling", rec) || "(not set yet)", names?("Athlete(s): "+names):""));
    });
  }
}
function viewPracticeTeam(container){
  var lvl = state.level;
  var tbucket = getBucket(["team", lvl]);
  var segs = tbucket.segments || [];
  if(!segs.length){
    container.appendChild(el("div",{class:"pempty"},["No team routine segments built yet."]));
  }
  segs.forEach(function(seg, idx){
    var groupsTxt = segmentPerformerGroupsText(seg);
    var title = (idx+1)+". "+seg.category+(seg.synced?" — SYNCED":"")+(seg.filler?" — FILLER":"");
    container.appendChild(practiceCard(title, teamSkillLabel(seg) || "(skill not set yet)", groupsTxt?("Performers: "+groupsTxt):""));
  });
}
function viewPractice(container){
  var lvl = state.level;
  container.appendChild(el("div",{class:"psectitle"},["LEVEL "+lvl+" — PRACTICE REFERENCE"+(state.teamName?" · "+state.teamName:"")]));

  if(state.practiceRound==="compulsory"){
    practiceSubTabs(container, state.practiceSub, function(v){ state.practiceSub=v; save(); renderAll(); });
    container.appendChild(practiceSection("Compulsory — "+state.practiceSub));
    viewPracticeCompulsorySub(container, state.practiceSub);
  } else if(state.practiceRound==="optional"){
    practiceSubTabs(container, state.practiceSub, function(v){ state.practiceSub=v; save(); renderAll(); });
    container.appendChild(practiceSection("Optional — "+state.practiceSub));
    viewPracticeOptionalSub(container, state.practiceSub);
  } else {
    container.appendChild(practiceSection("Team Routine — in order"));
    viewPracticeTeam(container);
  }
}

/* ---------------- Top nav + render ---------------- */
function renderModeSwitch(){
  var sw = document.getElementById("modeSwitch");
  sw.innerHTML = "";
  [["practice","Practice"],["edit","Edit"]].forEach(function(m){
    sw.appendChild(el("button",{class:"modebtn"+(state.mode===m[0]?" active":""), type:"button", onclick:function(){ state.mode=m[0]; save(); renderAll(); }},[m[1]]));
  });
}
function renderNav(){
  renderModeSwitch();
  var roundTabs = document.getElementById("roundTabs");
  roundTabs.innerHTML = "";
  if(state.mode==="edit"){
    [["compulsory","Compulsory"],["optional","Optional"],["team","Team Routine"],["export","My Export"],["judges","Judges"]].forEach(function(r){
      var t = el("button",{class:"tab"+(state.round===r[0]?" active":""), type:"button", onclick:function(){ state.round=r[0]; renderAll(); }},[r[1]]);
      roundTabs.appendChild(t);
    });
  } else {
    [["compulsory","Compulsory"],["optional","Optional"],["team","Team Routine"]].forEach(function(r){
      var t = el("button",{class:"tab"+(state.practiceRound===r[0]?" active":""), type:"button", onclick:function(){ state.practiceRound=r[0]; save(); renderAll(); }},[r[1]]);
      roundTabs.appendChild(t);
    });
  }
  var levelPills = document.getElementById("levelPills");
  levelPills.innerHTML = "";
  [3,4].forEach(function(l){
    var p = el("button",{class:"pill"+(state.level===l?" active":""), type:"button", onclick:function(){ state.level=l; renderAll(); }},["Level "+l]);
    levelPills.appendChild(p);
  });
}
function renderTeam(){ var app=document.getElementById("app"); app.innerHTML=""; viewTeam(app); }
function renderAll(){
  renderNav();
  var app = document.getElementById("app");
  app.innerHTML = "";
  if(state.mode==="practice"){ viewPractice(app); return; }
  if(state.round==="compulsory") viewCompulsory(app);
  else if(state.round==="optional") viewOptional(app);
  else if(state.round==="team") viewTeam(app);
  else if(state.round==="judges") viewJudges(app);
  else viewExport(app);
}

load();
fbInit();
checkAccess();
function start(){ renderAll(); }
start();
})();
</script>
</body>
